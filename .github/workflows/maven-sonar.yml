name: Maven Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    types: [ opened, synchronize, reopened ]
jobs:
  build-and-sonar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5.0.0

      - name: Set up JDK 25
        uses: actions/setup-java@v5.0.0
        with:
          distribution: oracle
          java-version: '25'
          cache: maven

      - name: Build and verify with Maven
        run: mvn clean verify